<div class="container page-content">
  <div class="admin-login-inline-grid">
    <div class="login-panel">
      <h3>Login</h3>
      <form [formGroup]="form" (ngSubmit)="handleLogin()">
        <div class="form-field" style="text-align: left">
          <label>User Name</label>
          <input type="text" placeholder="Enter user name" formControlName="username" />
        </div>
        <div class="form-field" style="text-align: left">
          <label>Password</label>
          <div class="icon-input">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="Enter password"
              formControlName="password"
            />
            <button
              type="button"
              class="field-icon-toggle"
              (click)="togglePassword()"
              aria-label="Toggle password visibility"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>
        <button class="btn-primary" type="submit">Login</button>
      </form>
      <p class="demo-note">Demo only — any credentials will log you in.</p>
    </div>
  </div>
</div>
